name: Build and Push Docker Image

on:
  schedule:
    - cron: "41 3 * * *"  # Run daily at midnight
  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch latest release version
        id: fetch_release
        run: |
          REPO_OWNER="userdocs"
          REPO_NAME="qbittorrent-nox-static"

          # Fetch the latest release using GitHub API
          LATEST_RELEASE=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/$REPO_OWNER/$REPO_NAME/releases/latest")

          if [ -z "$LATEST_RELEASE" ]; then
            echo "Error: Failed to fetch the latest release."
            exit 1
          fi

          echo "Fetched LATEST_RELEASE: $LATEST_RELEASE"

          # Parse JSON fields safely
          FULL_VERSION=$(echo "$LATEST_RELEASE" | jq -r '.tag_name // empty')
          PRERELEASE=$(echo "$LATEST_RELEASE" | jq -r '.prerelease // false')

          if [ -z "$FULL_VERSION" ]; then
            echo "Error: 'tag_name' is missing or empty in the release data."
            exit 1
          fi

          # Extract the simplified version for Docker image tagging using delimiter '-' and '_'
          VERSION=$(echo "$FULL_VERSION" | sed -n 's/release-\([^-_]*\)_.*/\1/p')

          if [ -z "$VERSION" ]; then
            echo "Error: Failed to parse the version from '$FULL_VERSION'."
            exit 1
          fi

          echo "Latest release tag: $FULL_VERSION"
          echo "Simplified version for Docker: $VERSION"

          # Check if the release is a pre-release
          if [ "$PRERELEASE" == "true" ] || [[ "$FULL_VERSION" == *beta* ]] || [[ "$FULL_VERSION" == *rc* ]] || [[ "$FULL_VERSION" == *alpha* ]]; then
            echo "Pre-release or invalid version detected. Skipping build."
            echo "skip_build=true" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "version=$VERSION" >> "$GITHUB_ENV"
          echo "full_version=$FULL_VERSION" >> "$GITHUB_ENV"

      - name: Check if build was skipped
        if: env.skip_build == 'true'
        run: echo "Build was skipped due to pre-release or invalid version."

      - name: Check if tag already exists in this repository
        id: check_tag
        if: env.skip_build != 'true'
        run: |
          FULL_VERSION=${{ env.full_version }}

          # Ensure all tags are fetched
          git fetch --tags

          # Check if the tag exists in the remote repository
          TAG_EXISTS=$(git ls-remote --tags origin "$FULL_VERSION" | wc -l)

          if [ "$TAG_EXISTS" -gt 0 ]; then
            echo "Tag $FULL_VERSION already exists in this repository. Skipping build."
            echo "skip_build=true" >> "$GITHUB_ENV"
            exit 0
          else
            echo "Tag $FULL_VERSION does not exist. Proceeding to build."
          fi

      - name: Checkout repository
        if: env.skip_build != 'true'
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        if: env.skip_build != 'true'
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        if: env.skip_build != 'true'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        if: env.skip_build != 'true'
        env:
          VERSION: ${{ env.version }}
          DOCKERHUB_USERNAME: nephim
        run: |
          docker build -t $DOCKERHUB_USERNAME/qbittorrentalpine:$VERSION .
          docker push $DOCKERHUB_USERNAME/qbittorrentalpine:$VERSION
          docker tag $DOCKERHUB_USERNAME/qbittorrentalpine:$VERSION $DOCKERHUB_USERNAME/qbittorrentalpine:latest
          docker push $DOCKERHUB_USERNAME/qbittorrentalpine:latest

      - name: Create GitHub tag for this version
        if: env.skip_build != 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          FULL_VERSION=${{ env.full_version }}
          git tag $FULL_VERSION
          git push origin $FULL_VERSION
          
      - name: Notify on Discord
        if: env.skip_build != 'true'
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          VERSION=${{ env.version }}
          FULL_VERSION=${{ env.full_version }}
          curl -X POST -H "Content-Type: application/json" \
            -d '{
                  "content": "**New Docker Image Created!**",
                  "embeds": [
                    {
                      "title": "Docker Image Created",
                      "description": "A new Docker image has been built and pushed to Docker Hub.",
                      "color": 3066993,
                      "fields": [
                        { "name": "Version", "value": "'"$VERSION"'", "inline": true },
                        { "name": "Full Version", "value": "'"$FULL_VERSION"'", "inline": true }
                      ]
                    }
                  ]
                }' \
            $WEBHOOK_URL

