name: Build and Push Docker Image

on:
  schedule:
    - cron: "0 0 * * *"  # Run daily at midnight
  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch latest release version
        id: fetch_release
        run: |
          REPO_OWNER="userdocs"
          REPO_NAME="qbittorrent-nox-static"

          # Fetch the latest release using GitHub API
          LATEST_RELEASE=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/$REPO_OWNER/$REPO_NAME/releases/latest")

          VERSION=$(echo "$LATEST_RELEASE" | jq -r .tag_name)
          PRERELEASE=$(echo "$LATEST_RELEASE" | jq -r .prerelease)

          echo "Latest release tag: $VERSION"

          # Check if the release is a pre-release
          if [ "$PRERELEASE" == "true" ] || [[ "$VERSION" == *beta* ]] || [[ "$VERSION" == *rc* ]] || [[ "$VERSION" == *alpha* ]]; then
            echo "Pre-release or invalid version detected. Skipping build."
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if build was skipped
        if: steps.fetch_release.outputs.skip_build == 'true'
        run: echo "Build was skipped due to pre-release or invalid version."

      - name: Check if release already exists
        id: check_release
        if: steps.fetch_release.outputs.skip_build != 'true'
        run: |
          REPO_OWNER="Nephim"
          REPO_NAME="docker-qbittorrentalpine"
          VERSION=${{ steps.fetch_release.outputs.version }}

          # Check if a GitHub release with this version already exists
          RELEASE_EXISTS=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/$REPO_OWNER/$REPO_NAME/releases/tags/$VERSION" \
            -o /dev/null -w "%{http_code}")

          if [ "$RELEASE_EXISTS" -eq 200 ]; then
            echo "Release with version $VERSION already exists. Skipping build."
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "No release with version $VERSION found. Proceeding to build."
          fi

      - name: Checkout repository
        if: steps.fetch_release.outputs.skip_build != 'true' && steps.check_release.outputs.skip_build != 'true'
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        if: steps.fetch_release.outputs.skip_build != 'true' && steps.check_release.outputs.skip_build != 'true'
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        if: steps.fetch_release.outputs.skip_build != 'true' && steps.check_release.outputs.skip_build != 'true'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        if: steps.fetch_release.outputs.skip_build != 'true' && steps.check_release.outputs.skip_build != 'true'
        env:
          VERSION: ${{ steps.fetch_release.outputs.version }}
          DOCKERHUB_USERNAME: nephim
        run: |
          docker build -t $DOCKERHUB_USERNAME/qbittorrentalpine:$VERSION .
          docker push $DOCKERHUB_USERNAME/qbittorrentalpine:$VERSION
          docker tag $DOCKERHUB_USERNAME/qbittorrentalpine:$VERSION $DOCKERHUB_USERNAME/qbittorrentalpine:latest
          docker push $DOCKERHUB_USERNAME/qbittorrentalpine:latest

      - name: Create GitHub release
        if: steps.fetch_release.outputs.skip_build != 'true' && steps.check_release.outputs.skip_build != 'true'
        uses: actions/create-release@v1
        with:
          tag_name: ${{ steps.fetch_release.outputs.version }}
          release_name: Release ${{ steps.fetch_release.outputs.version }}
          body: |
            Docker image built and pushed for version ${{ steps.fetch_release.outputs.version }}.
          draft: false
          prerelease: false
